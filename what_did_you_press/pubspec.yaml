name: what_did_you_press
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_webrtc: ^1.6.2+hotfix.4
  geolocator: ^14.1.2
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  precise_compass: ^0.2.0
  shared_preferences: ^2.5.3
  sensors_plus: ^7.1.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1E18"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1B1E18"
    theme_color: "#1B1E18"
